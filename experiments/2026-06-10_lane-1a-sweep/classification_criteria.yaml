# Lane 1a Classification Criteria (locked; hash-recorded in LOCK-RECORD.md)
#
# Doctrine: Lane 1a may rule out; Lane 1a may not rule in.
# Source of truth: Senior design packet v0.3 (sha256 f1280a85…)
# §13 normative manifest recipe v0.2 governs construction.
#
# Every classification constant below carries the SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE flag.
# Constants are reviewer-adjustable BEFORE lock; never after.

doctrine: "Lane 1a may rule out; Lane 1a may not rule in."
artifact_class: "lane-1a-reconnaissance"
certification_relevance: "none"

# B5: planned generation count under Option A (Manager 2026-06-10).
generation_plan:
  candidate_generations_per_rung: 96       # 80 answerable + 16 NULL
  control_generations_per_rung: 96         # 80 answerable_mirror + 16 null_mirror
  candidate_total: 768
  control_total: 768
  planned_generation_count: 1536
  control_scoring_denominator: 80          # B3: answerable-mirroring controls only
  null_mirror_scoring: "descriptive_only"  # B3: not entered in any accuracy statistic
  token_prior_path: "Option_A_authorized_by_name"

# B1 v2 invocation surface (Case B wrapper):
b1v2_invocation:
  mode: "live"                             # B1 v2 accepts only {dry-run, live}
  context: "paper2-reproduction"           # B1 v2 accepts only {paper2-reproduction, paper3-certification}
  framework_version: "none"                # already on B1 v2 locked surface
  wrapper_overrides_context_to: "lane-1a-reconnaissance"
  # B1 v2 source is NOT edited. lane1a_runner_wrapper.py applies overrides at the wrapper + schema layer.

# Constants — every entry tagged NOT-A-THRESHOLD-VALUE.
constants:

  # CS recommendation 5a / Team Lead 3.1: explicit SE_diff formula.
  se_diff_formula:
    expression: "sqrt(SE(strict)^2 + SE(control)^2)"
    se_strict_denom: "N_s_eff = 80 - void_count_answerable"
    se_control_denom: "N_c_eff = 80 - void_count_control_answerable_mirror"   # B3
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  token_prior_indistinguishability:
    rule: "strict_acc - control_acc <= 2 * SE_diff"
    SE_multiplier: 2
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  declared_policy_envelope_indistinguishability:
    rule: "strict_acc <= union_envelope_score + 2 * SE(strict_acc)"
    SE_multiplier: 2
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  # CS recommendation 5b / Team Lead 3.2: N_effective definition.
  insufficient_measurement_headroom:
    rule: "strict_acc >= 1 - 3 * SE(strict_acc, N_effective)"
    SE_multiplier: 3
    N_effective: "80 - void_count_answerable"
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  # B1: gap sign FIXED. gap := content_acc - strict_acc (was strict - content; dead rule).
  strict_content_gap_instability:
    rule: "gap >= 0.15"
    gap_definition: "content_acc - strict_acc"
    gap_threshold: 0.15
    unit_test: "content=0.90, strict=0.70 -> gap=0.20 -> label attaches"
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  abstention_contract_instability:
    rule: "(NULL_stratum_abstention_rate NOT IN [0.50, 0.95]) OR (NULL/error not mechanically separable)"
    band_low: 0.50
    band_high: 0.95
    null_stratum_size: 16
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  void_budget:
    rule: "void_count_total > 5 -> inconclusive_not_actionable"
    threshold: 5
    counts: "ALL voids (answerable + NULL + answerable_mirror + null_mirror)"
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  ladder:
    rungs:
      L01: { D: 4,  K: "low",  X: "base" }
      L02: { D: 8,  K: "low",  X: "base" }
      L03: { D: 16, K: "low",  X: "base" }
      L04: { D: 4,  K: "high", X: "base" }
      L05: { D: 8,  K: "high", X: "base" }
      L06: { D: 16, K: "high", X: "base" }
      L07: { D: 8,  K: "low",  X: "extended" }
      L08: { D: 8,  K: "high", X: "extended" }
    extended_context_target_tokens: 2048      # CS 5d / Team Lead 3.4
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

  per_rung_N:
    declared_total: 96
    answerable: 80
    null_stratum: 16
    answerable_mirror_control: 80
    null_mirror_control: 16
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

# K-axis definitions (§13 recipe §3).
k_axis:
  k_low:
    rule: "all key pairs differ at the very first character"
    MIN_PREFIX_DISTANCE_LOW: 1
    BASE_ALPHABET_LOW: "abcdefghijklmnopqrstuvwxyz"
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true
  k_high:
    rule: "all keys share a 3-char common prefix; disambiguating suffix is 3 chars"
    COMMON_PREFIX_LENGTH_HIGH: 3
    KEY_TOTAL_LENGTH: 6
    SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

# Fork A bar / novelty ledger (§13 recipe §6).
novelty:
  MAX_HISTORICAL_OVERLAP_FRACTION: 0.05
  novelty_ledger_path: "NOVELTY-LEDGER.md"
  SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

# Recipe acceptance check (§13 recipe §8).
recipe_acceptance:
  MIN_NONDEGENERATE_DISTINCT_PREDICTIONS: 3
  policies:
    - "pure_last_position"
    - "target_recency"
    - "salient_endpoint"
    - "copy_completion"
    - "homogeneous_prefix_completion"
  SWEEP_CLASSIFICATION_NOT_A_THRESHOLD_VALUE: true

# B-series corrections recorded for audit.
b_series_provenance:
  B1: "gap sign := content_acc - strict_acc (design packet v0.3 §1.6)"
  B2: "inconclusive preempts; void/anomaly/missing-output checks evaluate first; if any fires, labels = ['inconclusive_not_actionable'] only"
  B3: "control scoring stratum = 80 answerable-mirroring controls per rung; NULL-mirror controls descriptive-only"
  B4: "token-prior control authorization = Option A (Manager 2026-06-10) — authorized by name for Lane 1a; recorded in LOCK-RECORD.md"
  B5: "planned_generation_count = 1536 (candidate 768 + control 768); survivor set serialized in alphabetical rung-ID order; unit-tested"

# Re-execution rule (CS 5f).
re_execution_rule:
  policy: "no_re_execution_within_sweep"
  text: |
    A rung labeled inconclusive_not_actionable is not re-run within this sweep.
    A re-sweep on that rung requires fresh Manager authorization as a new packet.
  total_attempts_logged: true
