<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The transformer forward pass: real process aligned over the mountain-and-water analogy</title>
<desc>A left-to-right pipeline shown twice in parallel. Top row, the real process: tokenize, embed, position, then a repeated block of attention and feed-forward, then output. Bottom row, the analogy: valve, launch ridge, drop timestamp, then a repeated block of the ledge and siphons, then the precipice. Dashed vertical lines link each real step to its analogy. Arrows mean flow, left to right: computation advancing, not falling.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.t{font-size:14px;font-weight:500}
.ts{font-size:12px}
.blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5}
.blbl{fill:#0C447C}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.tlbl{fill:#085041}
.gray{fill:#5F5E5A}
.flow{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.dash{stroke:#888780;stroke-width:0.75;stroke-dasharray:4 4}
.brk{stroke:#888780;stroke-width:1;fill:none}
</style>

<text class="t gray" x="24" y="70">Real process</text>

<text class="ts gray" x="24" y="116">Text in</text>
<line x1="100" y1="112" x2="118" y2="112" class="flow" marker-end="url(#arr)"/>

<rect x="124" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="161" y="116" text-anchor="middle">Tokenize</text>
<rect x="214" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="251" y="116" text-anchor="middle">Embed</text>
<rect x="304" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="341" y="116" text-anchor="middle">Position</text>
<rect x="410" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="447" y="116" text-anchor="middle">Attention</text>
<rect x="500" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="537" y="110" text-anchor="middle">Feed-</text><text class="ts blbl" x="537" y="124" text-anchor="middle">forward</text>
<rect x="650" y="92" width="74" height="40" rx="6" class="blue"/><text class="ts blbl" x="687" y="116" text-anchor="middle">Output</text>

<line x1="198" y1="112" x2="214" y2="112" class="flow" marker-end="url(#arr)"/>
<line x1="288" y1="112" x2="304" y2="112" class="flow" marker-end="url(#arr)"/>
<line x1="378" y1="112" x2="410" y2="112" class="flow" marker-end="url(#arr)"/>
<line x1="484" y1="112" x2="500" y2="112" class="flow" marker-end="url(#arr)"/>
<line x1="574" y1="112" x2="650" y2="112" class="flow" marker-end="url(#arr)"/>
<text class="ts gray" x="734" y="116">Token out</text>

<path class="brk" d="M406 82 L406 74 L578 74 L578 82"/>
<text class="ts gray" x="492" y="66" text-anchor="middle">one block, repeated &#215;N</text>

<line x1="161" y1="140" x2="161" y2="182" class="dash"/>
<line x1="251" y1="140" x2="251" y2="182" class="dash"/>
<line x1="341" y1="140" x2="341" y2="182" class="dash"/>
<line x1="447" y1="140" x2="447" y2="182" class="dash"/>
<line x1="537" y1="140" x2="537" y2="182" class="dash"/>
<line x1="687" y1="140" x2="687" y2="182" class="dash"/>

<text class="t tlbl" x="24" y="162">The analogy</text>

<text class="ts gray" x="24" y="208">Water in</text>
<line x1="100" y1="204" x2="118" y2="204" class="flow" marker-end="url(#arr)"/>

<rect x="124" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="161" y="208" text-anchor="middle">Valve</text>
<rect x="214" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="251" y="202" text-anchor="middle">Launch</text><text class="ts tlbl" x="251" y="216" text-anchor="middle">ridge</text>
<rect x="304" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="341" y="202" text-anchor="middle">Drop</text><text class="ts tlbl" x="341" y="216" text-anchor="middle">timestamp</text>
<rect x="410" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="447" y="202" text-anchor="middle">The ledge</text><text class="ts tlbl" x="447" y="216" text-anchor="middle">(draw cargo)</text>
<rect x="500" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="537" y="202" text-anchor="middle">Siphons</text><text class="ts tlbl" x="537" y="216" text-anchor="middle">(alone)</text>
<rect x="650" y="184" width="74" height="40" rx="6" class="teal"/><text class="ts tlbl" x="687" y="202" text-anchor="middle">Precipice</text><text class="ts tlbl" x="687" y="216" text-anchor="middle">&#8594; summit</text>

<line x1="198" y1="204" x2="214" y2="204" class="flow" marker-end="url(#arr)"/>
<line x1="288" y1="204" x2="304" y2="204" class="flow" marker-end="url(#arr)"/>
<line x1="378" y1="204" x2="410" y2="204" class="flow" marker-end="url(#arr)"/>
<line x1="484" y1="204" x2="500" y2="204" class="flow" marker-end="url(#arr)"/>
<line x1="574" y1="204" x2="650" y2="204" class="flow" marker-end="url(#arr)"/>
<text class="ts gray" x="734" y="208">Word out</text>

<path class="brk" d="M406 234 L406 242 L578 242 L578 234"/>
<text class="ts gray" x="492" y="256" text-anchor="middle">descend the same ridges &#215;N</text>

<line x1="124" y1="306" x2="148" y2="306" class="dash"/>
<text class="ts gray" x="156" y="310">dashed line = "is the analogy for" (a mapping, not an equivalence)</text>
<line x1="124" y1="334" x2="148" y2="334" class="flow" marker-end="url(#arr)"/>
<text class="ts gray" x="156" y="338">arrow = flow, left to right: computation advancing, not falling. There is no force.</text>
</svg>
